<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0710" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f7fb" media="(prefers-color-scheme: light)" />
    <title>HeimerClean — Deep clean PC optimization for Windows</title>
    <meta
      name="description"
      content="HeimerClean removes junk files, reduces background clutter and keeps Windows optimized automatically. Silent cleanup, faster startup, steadier performance."
    />
    <meta property="og:title" content="HeimerClean — Deep clean PC optimization for Windows" />
    <meta property="og:description" content="Silent cleanup, faster startup, steadier performance. From $1.99." />
    <script>
      ;(() => {
        const stored = localStorage.getItem('hc-theme')
        const dark = stored ? stored === 'dark' : true
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
